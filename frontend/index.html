<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FloatChat — RAG Conversational Interface for ARGO Ocean Float Data</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        min-height: 100vh;
        overflow-x: hidden;
      }
      #root {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      /* Global styles for components */
      .dashboard {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
      }
      .topnav {
        height: 56px;
        background-color: #1e293b;
        border-bottom: 1px solid #334155;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1.5rem;
      }
      .nav-logo {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: #38bdf8;
        font-weight: 700;
        font-size: 1.2rem;
        text-decoration: none;
      }
      .nav-links {
        display: flex;
        gap: 1rem;
      }
      .nav-link {
        color: #94a3b8;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
      }
      .nav-link:hover { color: #f8fafc; }
      
      .dashboard-main {
        display: flex;
        flex: 1;
        overflow: hidden;
      }
      .chat-sidebar {
        width: 420px;
        min-width: 320px;
        background-color: #0f172a;
        border-right: 1px solid #334155;
        display: flex;
        flex-direction: column;
      }
      .viz-panel {
        flex: 1;
        background-color: #020617;
        position: relative;
      }

      /* ChatPanel styles */
      .chat-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .chat-header {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #334155;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .chat-title {
        font-weight: 600;
        color: #38bdf8;
      }
      .messages-container {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .message-bubble {
        max-width: 90%;
        padding: 0.75rem 1rem;
        border-radius: 12px;
        font-size: 0.92rem;
        line-height: 1.5;
      }
      .message-bubble.user {
        align-self: flex-end;
        background-color: #0284c7;
        color: #ffffff;
      }
      .message-bubble.assistant {
        align-self: flex-start;
        background-color: #1e293b;
        color: #f1f5f9;
        border: 1px solid #334155;
      }
      .input-row {
        padding: 0.75rem 1rem;
        border-top: 1px solid #334155;
        display: flex;
        gap: 0.5rem;
        align-items: center;
        background-color: #0f172a;
      }
      .chat-input {
        flex: 1;
        background-color: #1e293b;
        border: 1px solid #334155;
        border-radius: 8px;
        color: #f8fafc;
        padding: 0.5rem 0.75rem;
        font-family: inherit;
        resize: none;
        outline: none;
      }
      .chat-input:focus { border-color: #38bdf8; }
      .send-btn, .voice-btn, .icon-btn {
        background: #0284c7;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 0.5rem 0.75rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .voice-btn { background: #334155; }
      .voice-btn.recording { background: #ef4444; }
      .icon-btn { background: transparent; color: #94a3b8; }
      .icon-btn:hover { color: #f8fafc; }

      /* Mode toggle */
      .mode-toggle {
        display: flex;
        background-color: #0f172a;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 2px;
      }
      .mode-btn {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        background: none;
        border: none;
        color: #94a3b8;
        padding: 0.3rem 0.6rem;
        font-size: 0.8rem;
        border-radius: 6px;
        cursor: pointer;
      }
      .mode-btn.active {
        background-color: #0284c7;
        color: white;
      }

      /* Home page */
      .home-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 3rem 1.5rem;
      }
      .hero {
        text-align: center;
        max-width: 800px;
        margin-bottom: 4rem;
      }
      .hero-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background-color: #1e293b;
        color: #38bdf8;
        padding: 0.4rem 1rem;
        border-radius: 20px;
        font-size: 0.85rem;
        margin-bottom: 1.5rem;
        border: 1px solid #334155;
      }
      .hero-title {
        font-size: 3.5rem;
        font-weight: 800;
        background: linear-gradient(to right, #38bdf8, #818cf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 1rem;
      }
      .hero-subtitle {
        font-size: 1.2rem;
        color: #94a3b8;
        margin-bottom: 2rem;
      }
      .hero-actions {
        display: flex;
        justify-content: center;
        gap: 1rem;
      }
      .btn {
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        font-weight: 600;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }
      .btn-primary { background-color: #0284c7; color: white; }
      .btn-outline { border: 1px solid #334155; color: #f8fafc; }

      .feature-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1st));
        gap: 1.5rem;
        width: 100%;
        max-width: 1000px;
      }
      .feature-card {
        background-color: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 1.5rem;
      }
      .feature-icon { color: #38bdf8; margin-bottom: 1rem; }
      .usp-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: center;
        margin-top: 1rem;
      }
      .usp-chip {
        background-color: #1e293b;
        border: 1px solid #38bdf8;
        color: #38bdf8;
        padding: 0.3rem 0.8rem;
        border-radius: 15px;
        font-size: 0.85rem;
      }

      /* Explainability & Anomaly */
      .explain-panel {
        margin-top: 0.5rem;
        padding: 0.75rem;
        background: #0f172a;
        border-radius: 8px;
        border: 1px solid #334155;
        font-size: 0.8rem;
      }
      .explain-sql {
        background: #020617;
        padding: 0.5rem;
        border-radius: 6px;
        overflow-x: auto;
        color: #38bdf8;
        margin-top: 0.4rem;
      }
      .anomaly-banner {
        margin-top: 0.5rem;
        padding: 0.6rem 0.8rem;
        border-radius: 8px;
        display: flex;
        gap: 0.5rem;
        align-items: flex-start;
      }
      .anomaly-banner.warning { background: #451a03; border: 1px solid #f59e0b; color: #fef3c7; }
      .anomaly-banner.critical { background: #450a0a; border: 1px solid #ef4444; color: #fee2e2; }

      .empty-state {
        text-align: center;
        padding: 2rem 1rem;
        color: #94a3b8;
      }
      .suggested-queries {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      .suggest-btn {
        background: #1e293b;
        border: 1px solid #334155;
        color: #e2e8f0;
        padding: 0.5rem 0.8rem;
        border-radius: 6px;
        font-size: 0.85rem;
        cursor: pointer;
        text-align: left;
      }
      .suggest-btn:hover { border-color: #38bdf8; }
      .export-row { padding: 0.5rem 1rem; border-top: 1px solid #334155; }
      .export-btn {
        background: none;
        border: 1px solid #334155;
        color: #38bdf8;
        padding: 0.3rem 0.6rem;
        border-radius: 6px;
        font-size: 0.8rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
